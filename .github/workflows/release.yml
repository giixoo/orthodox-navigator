# Builds standalone binaries and install packages.
#   push a tag like v0.2.0  -> builds everything and publishes a GitHub release with the files
#   Actions -> Release -> Run workflow -> builds everything; the files are on the run's page (Artifacts)
#
# Windows x64: on-<ver>-windows-x64.exe (just the program), .zip (program + shell function), -setup.exe (installer)
# Linux x64 / arm64: on-<ver>-linux-<arch> (static, runs on any distribution), .tar.gz, .deb, .rpm
# macOS: on-<ver>-macos-universal (one binary for Apple silicon and Intel), .tar.gz

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $v = $env:GITHUB_REF_NAME.TrimStart('v')
            (Get-Content rust/Cargo.toml) -replace '^version = ".*"', "version = `"$v`"" | Set-Content rust/Cargo.toml
          } else {
            $v = (Select-String -Path rust/Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          }
          "v=$v" >> $env:GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Test
        working-directory: rust
        run: cargo test --release

      - name: Build
        working-directory: rust
        run: cargo build --release

      - name: Standalone exe and zip
        run: |
          $v = '${{ steps.ver.outputs.v }}'
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item rust/target/release/on.exe "dist/on-$v-windows-x64.exe"
          $d = "stage/on-$v-windows-x64"
          New-Item -ItemType Directory -Force "$d/bin", "$d/shell" | Out-Null
          Copy-Item rust/target/release/on.exe "$d/bin/"
          Copy-Item shell/on.ps1 "$d/shell/"
          Copy-Item README.md, LICENSE "$d/"
          Compress-Archive -Path $d -DestinationPath "dist/on-$v-windows-x64.zip"

      - name: Installer
        run: |
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /Qp "/DAppVersion=${{ steps.ver.outputs.v }}" "/O$PWD\dist" packaging/windows/on.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            v=${GITHUB_REF_NAME#v}
            sed -i "0,/^version = .*/s//version = \"$v\"/" rust/Cargo.toml
          else
            v=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)
          fi
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - name: musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: Test
        working-directory: rust
        run: cargo test --release

      - name: Build (static)
        working-directory: rust
        run: cargo build --release --target ${{ matrix.target }}

      - name: Standalone binary and tar.gz
        run: |
          v=${{ steps.ver.outputs.v }}
          name=on-$v-linux-${{ matrix.arch }}
          mkdir -p dist "stage/$name/bin" "stage/$name/shell"
          cp rust/target/${{ matrix.target }}/release/on "dist/$name"
          cp rust/target/${{ matrix.target }}/release/on "stage/$name/bin/"
          cp shell/on.sh "stage/$name/shell/"
          cp README.md LICENSE "stage/$name/"
          tar -C stage -czf "dist/$name.tar.gz" "$name"

      - name: deb and rpm
        working-directory: rust
        run: |
          cargo deb --no-build --target ${{ matrix.target }} -o ../dist/
          cargo generate-rpm --target ${{ matrix.target }} -o ../dist/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            v=${GITHUB_REF_NAME#v}
            # macOS sed has no "0,/re/" address: awk replaces only the first version line (the package's)
            awk -v v="$v" '!done && /^version = / { print "version = \"" v "\""; done = 1; next } 1' rust/Cargo.toml > Cargo.toml.new
            mv Cargo.toml.new rust/Cargo.toml
          else
            v=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)
          fi
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Test
        working-directory: rust
        run: cargo test --release

      - name: Build (Apple silicon and Intel)
        working-directory: rust
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Universal binary and tar.gz
        run: |
          v=${{ steps.ver.outputs.v }}
          name=on-$v-macos-universal
          mkdir -p dist "stage/$name/bin" "stage/$name/shell"
          lipo -create -output "dist/$name" \
            rust/target/aarch64-apple-darwin/release/on rust/target/x86_64-apple-darwin/release/on
          lipo -info "dist/$name"
          cp "dist/$name" "stage/$name/bin/on"
          cp shell/on.sh "stage/$name/shell/"
          cp README.md LICENSE "stage/$name/"
          tar -C stage -czf "dist/$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  release:
    if: github.ref_type == 'tag'
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      # the release notes are this version's section of CHANGELOG.md ("## [0.2.0]" or "## 0.2.0 ...")
      - name: Release notes
        run: |
          v=${GITHUB_REF_NAME#v}
          awk -v v="$v" '
            /^## / { if (on) exit; on = ($2 == v || $2 == "[" v "]") ; next }
            on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          raw=https://raw.githubusercontent.com/${{ github.repository }}/main
          cat >> notes.md <<EOF

          ### Install

          Windows (PowerShell): \`irm $raw/install.ps1 | iex\`

          Linux / macOS: \`curl -fsSL $raw/install.sh | sh\`

          Then open a new terminal and type \`on\`. Run the same command again to update.
          EOF
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
          generate_release_notes: true
